name: Publish approved release to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published, signed stable release version (without v)
        required: true
        type: string
      destination:
        description: Package index
        required: true
        type: choice
        default: testpypi
        options:
          - testpypi
          - pypi

permissions: {}

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'HKUDS/nanobot' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.staged.outputs.artifact-id }}
      upload_required: ${{ steps.reconcile.outputs.upload_required }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install locked verification dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/release-signing-requirements.txt
      - name: Download and verify the approved public release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$VERSION"
          gh release view "$tag" --repo HKUDS/nanobot --json tagName,isDraft,isPrerelease \
            | jq -e --arg tag "$tag" '.tagName == $tag and .isDraft == false and .isPrerelease == false' >/dev/null
          git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          commit="$(git rev-parse "refs/tags/$tag^{commit}")"
          gh release download "$tag" --repo HKUDS/nanobot --dir "$RUNNER_TEMP/release" \
            --pattern 'release-manifest.json' --pattern 'release-manifest.json.sigstore.json' \
            --pattern 'nanobot_ai-*.whl' --pattern 'nanobot_ai-*.tar.gz' \
            --pattern 'nanobot-tui-*.zip' --pattern 'nanobot-tui-*.zip.sha256'
          python -m scripts.prepare_pypi_release --release-dir "$RUNNER_TEMP/release" \
            --output "$RUNNER_TEMP/pypi" --version "$VERSION" --tag-commit "$commit"
      - name: Check for an interrupted upload
        id: reconcile
        env:
          VERSION: ${{ inputs.version }}
          DESTINATION: ${{ inputs.destination }}
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.reconcile_pypi_release --directory "$RUNNER_TEMP/pypi" \
            --version "$VERSION" --destination "$DESTINATION"
          if [[ -n "$(find "$RUNNER_TEMP/pypi" -type f -print -quit)" ]]; then
            echo 'upload_required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'upload_required=false' >> "$GITHUB_OUTPUT"
            echo 'The complete release is already present with matching hashes.'
          fi
      - name: Transfer verified PyPI files
        if: steps.reconcile.outputs.upload_required == 'true'
        id: staged
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-pypi-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pypi/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    if: needs.verify.outputs.upload_required == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.destination == 'pypi' && 'pypi' || 'testpypi' }}
    timeout-minutes: 20
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - name: Publish with PyPI Trusted Publishing
        if: inputs.destination == 'pypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
      - name: Publish to TestPyPI
        if: inputs.destination == 'testpypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
