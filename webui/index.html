<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=auto"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="nanobot web UI — chat with your nanobot workspace."
      data-i18n-meta="description"
    />
    <meta
      name="theme-color"
      content="#ffffff"
      data-theme-color-light="#ffffff"
      data-theme-color-dark="#303030"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="nanobot" />
    <link rel="icon" type="image/svg+xml" href="/brand/nanobot_mark.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/brand/nanobot_favicon_32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/nanobot_apple_touch.png" />
    <link rel="manifest" href="/manifest.json" />
    <style>
      html,
      body,
      #root {
        height: 100%;
      }

      /* App-like feel on touch devices: no double-tap zoom on interactive
         elements (system-level accessibility zoom still works), and no text
         size inflation on orientation change. */
      html {
        -webkit-text-size-adjust: 100%;
        touch-action: manipulation;
      }

      body {
        margin: 0;
        background: #ffffff;
        color: #0a0a0a;
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", "Noto Sans SC",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
      }

      html.dark body {
        background: #303030;
        color: #fafafa;
      }

      .startup-shell { position: relative; height: 100%; }
      .startup-header { display: flex; justify-content: space-between; padding: 5px 13px; }
      .startup-control-shadow {
        width: 28px; height: 28px; border-radius: 8px; background: rgba(0,0,0,0.025);
      }
      .startup-composer {
        position: absolute; inset-inline: 16px; bottom: max(24px, env(safe-area-inset-bottom));
        box-sizing: border-box; max-width: 768px; margin-inline: auto;
        height: 96px; border-radius: 24px; background: rgba(0,0,0,0.025);
      }
      .startup-status {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
      }
      html.dark :is(.startup-control-shadow, .startup-composer) { background: rgba(255,255,255,0.035); }
    </style>
    <script>
      (function () {
        try {
          var stored = null;
          try {
            stored = localStorage.getItem("nanobot-webui.theme");
          } catch {}
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) {
            var color = themeColor.getAttribute(
              dark ? "data-theme-color-dark" : "data-theme-color-light"
            );
            if (color) themeColor.setAttribute("content", color);
          }
        } catch {}
      })();
    </script>
    <title>nanobot</title>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root">
      <main class="startup-shell" aria-busy="true">
        <div class="startup-header" aria-hidden="true">
          <span class="startup-control-shadow"></span>
          <span class="startup-control-shadow"></span>
        </div>
        <div class="startup-composer" aria-hidden="true"></div>
        <div class="startup-status" role="status">
          <span data-boot-copy>Loading nanobot…</span>
        </div>
      </main>
    </div>
    <script>
      (function () {
        var localeKey = "nanobot.locale";
        var copy = {
          en: {
            boot: "Loading nanobot…",
            description: "nanobot web UI — chat with your nanobot workspace."
          },
          "zh-CN": {
            boot: "正在加载 nanobot…",
            description: "nanobot Web UI —— 与你的 nanobot 工作区对话。"
          },
          "zh-TW": {
            boot: "正在載入 nanobot…",
            description: "nanobot Web UI —— 與你的 nanobot 工作區對話。"
          },
          fr: {
            boot: "Chargement de nanobot…",
            description: "Interface web nanobot — discutez avec votre espace de travail nanobot."
          },
          ja: {
            boot: "nanobot を読み込み中…",
            description: "nanobot Web UI — nanobot ワークスペースと会話します。"
          },
          ko: {
            boot: "nanobot 불러오는 중…",
            description: "nanobot 웹 UI — nanobot 작업공간과 대화하세요."
          },
          es: {
            boot: "Cargando nanobot…",
            description: "Interfaz web de nanobot: conversa con tu espacio de trabajo de nanobot."
          },
          "pt-BR": {
            boot: "Carregando nanobot…",
            description: "Interface web do nanobot — converse com o seu espaço de trabalho do nanobot."
          },
          vi: {
            boot: "Đang tải nanobot…",
            description: "Giao diện web nanobot — trò chuyện với không gian làm việc nanobot của bạn."
          },
          id: {
            boot: "Memuat nanobot…",
            description: "UI web nanobot — ngobrol dengan ruang kerja nanobot Anda."
          },
          pl: {
            boot: "Ładowanie nanobota…",
            description: "Interfejs WWW nanobota — rozmawiaj ze swoim agentem w obszarze roboczym."
          }
        };

        function normalizeLocale(input) {
          if (!input) return "en";
          var raw = String(input).trim();
          if (!raw) return "en";
          if (copy[raw]) return raw;
          var lower = raw.toLowerCase();
          if (lower === "zh" || lower.indexOf("zh-cn") === 0 || lower.indexOf("zh-sg") === 0) {
            return "zh-CN";
          }
          if (
            lower.indexOf("zh-tw") === 0 ||
            lower.indexOf("zh-hk") === 0 ||
            lower.indexOf("zh-mo") === 0 ||
            lower.indexOf("zh-hant") === 0
          ) {
            return "zh-TW";
          }
          if (lower === "pt" || lower.indexOf("pt-") === 0) {
            return "pt-BR";
          }
          var base = lower.split("-")[0];
          return copy[base] ? base : "en";
        }

        try {
          var stored = localStorage.getItem(localeKey);
          var detected =
            stored ||
            (navigator.languages && navigator.languages[0]) ||
            navigator.language ||
            "en";
          var locale = normalizeLocale(detected);
          var localized = copy[locale] || copy.en;
          document.documentElement.lang = locale;
          var description = document.querySelector('[data-i18n-meta=\"description\"]');
          if (description) description.setAttribute("content", localized.description);
          var boot = document.querySelector("[data-boot-copy]");
          if (boot) boot.textContent = localized.boot;
        } catch {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
