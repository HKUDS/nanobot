[project]
name = "nanobot-mail-watcher"
version = "0.2.0"
description = "Durable Carillon-to-Himalaya mailbox automation for Nanobot"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8"]

[project.scripts]
nanobot-mail = "nanobot_mail_watcher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanobot_mail_watcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
