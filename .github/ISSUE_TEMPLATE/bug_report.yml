name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below to help us diagnose the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what went wrong.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Configure nanobot with ...
        2. Send message ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: |
        Paste any relevant log output. You can run nanobot with `--log-level DEBUG` for more verbose logs.
        **Remember to redact any sensitive information (tokens, API keys, passwords, etc.)**
      render: shell

  - type: input
    id: version
    attributes:
      label: nanobot Version
      description: Run `nanobot --version` or `pip show nanobot-ai`
      placeholder: e.g., 0.2.0
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python Version
      description: Python version running the nanobot gateway.
      placeholder: e.g., 3.12.10
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: Operating system running the nanobot gateway (including container OS).
      placeholder: e.g., Windows, macOS, Linux, Docker
    validations:
      required: true

  - type: input
    id: channel
    attributes:
      label: Channel / Platform
      description: Which messaging platform are you using?
      placeholder: e.g., WebSocket, Telegram, Feishu (Lark), API Server
    validations:
      required: true

  - type: input
    id: llm_provider
    attributes:
      label: LLM Provider
      description: Configured default provider. Edit if the affected conversation uses another provider.
      placeholder: e.g., openai, openai_codex, anthropic, deepseek
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model
      description: Configured default model. Edit if the affected conversation uses another model.
      placeholder: e.g., openai/gpt-4o

  - type: input
    id: browser
    attributes:
      label: Browser
      description: Browser version or user agent, for WebUI issues.

  - type: input
    id: connection
    attributes:
      label: Connection
      description: How the WebUI connects to the gateway.
      placeholder: e.g., Local host, Remote host, Direct WebUI

  - type: textarea
    id: config
    attributes:
      label: Configuration (Optional)
      description: |
        Relevant parts of your nanobot configuration. **Remember to redact any sensitive information.**
      render: yaml

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or information that might help.
