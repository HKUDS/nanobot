name: iCloud calendar service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['services/icloud-calendar/**', 'nanobot/**', 'pyproject.toml', '.github/workflows/icloud-calendar.yml']
  pull_request:
    branches: [main]
    paths: ['services/icloud-calendar/**', 'nanobot/**', 'pyproject.toml', '.github/workflows/icloud-calendar.yml']

permissions:
  contents: read

jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install gateway and calendar service
        run: python -m pip install -e . -e 'services/icloud-calendar[dev]'
      - name: Lint
        working-directory: services/icloud-calendar
        run: ruff check .
      - name: Test without external services
        working-directory: services/icloud-calendar
        run: python -m pytest -q
      - name: Build wheel
        working-directory: services/icloud-calendar
        run: python -m pip wheel --no-deps --wheel-dir dist .
