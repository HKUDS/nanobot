    <link rel="manifest" href="/manifest.json" />
    <style>
      html,
      body,
      #root {
        height: 100%;
      }

      /* App-like feel on touch devices: no double-tap zoom on interactive
         elements (system-level accessibility zoom still works), and no text
         size inflation on orientation change. */
      html {
        -webkit-text-size-adjust: 100%;
      }

      /* Double-tap zoom suppression stays scoped to interactive controls so
         page-level pinch zoom and text selection remain available. */
      button,
      a,
      input,
      select,
      textarea,
      summary,
      [role="button"] {
        touch-action: manipulation;
      }

      body {
        margin: 0;
        background: #ffffff;
        color: #0a0a0a;
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", "Noto Sans SC",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
      }

html.dark body {
        background: #303030;
        color: #fafafa;
      }

      /* Devices that report no safe-area inset (e.g. floating-status-bar
         iPhones) still need the header kept below the status bar; a small
         load-time script toggles .no-safe-area on <html> when detected. */
      .thread-header-safe {
        padding-top: env(safe-area-inset-top);
      }
      html.no-safe-area .thread-header-safe {
        padding-top: 20px;
      }

      .boot-splash {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
      }

      .boot-splash-inner {
        display: flex;
        align-items: center;
        gap: 10px;
        color: rgba(255, 255, 255, 0.74);
        font-size: 14px;
      }

      html:not(.dark) .boot-splash-inner {
        color: rgba(10, 10, 10, 0.64);
      }

      .boot-dot {
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        background: currentColor;
        opacity: 0.75;
        animation: boot-pulse 1s ease-in-out infinite;
      }

      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(0.9);
          opacity: 0.45;
        }
        50% {
          transform: scale(1);
          opacity: 0.85;
        }
      }
    </style>
    <script>
      (function () {
        try {
          var stored = null;
          try {
            stored = localStorage.getItem("nanobot-webui.theme");
          } catch {}
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) {
            var color = themeColor.getAttribute(
              dark ? "data-theme-color-dark" : "data-theme-color-light"
            );
            if (color) themeColor.setAttribute("content", color);
          }
        } catch {}
      })();
    </script>
    <title>nanobot</title>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root">
      <div class="boot-splash">
        <div class="boot-splash-inner">
          <span class="boot-dot" aria-hidden="true"></span>
          <span data-boot-copy>Loading nanobot…</span>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var localeKey = "nanobot.locale";
        var copy = {
          en: {
            boot: "Loading nanobot…",
            description: "nanobot web UI — chat with your nanobot workspace."
          },
          "zh-CN": {
            boot: "正在加载 nanobot…",
            description: "nanobot Web UI —— 与你的 nanobot 工作区对话。"
          },
          "zh-TW": {
            boot: "正在載入 nanobot…",
            description: "nanobot Web UI —— 與你的 nanobot 工作區對話。"
          },
          fr: {
            boot: "Chargement de nanobot…",
            description: "Interface web nanobot — discutez avec votre espace de travail nanobot."
          },
          ja: {
            boot: "nanobot を読み込み中…",
            description: "nanobot Web UI — nanobot ワークスペースと会話します。"
          },
          ko: {
            boot: "nanobot 불러오는 중…",
            description: "nanobot 웹 UI — nanobot 작업공간과 대화하세요."
          },
          es: {
            boot: "Cargando nanobot…",
            description: "Interfaz web de nanobot: conversa con tu espacio de trabajo de nanobot."
          },
          "pt-BR": {
            boot: "Carregando nanobot…",
            description: "Interface web do nanobot — converse com o seu espaço de trabalho do nanobot."
          },
          vi: {
            boot: "Đang tải nanobot…",
            description: "Giao diện web nanobot — trò chuyện với không gian làm việc nanobot của bạn."
          },
          id: {
            boot: "Memuat nanobot…",
            description: "UI web nanobot — ngobrol dengan ruang kerja nanobot Anda."
          }
        };

        function normalizeLocale(input) {
          if (!input) return "en";
          var raw = String(input).trim();
          if (!raw) return "en";
          if (copy[raw]) return raw;
          var lower = raw.toLowerCase();
          if (lower === "zh" || lower.indexOf("zh-cn") === 0 || lower.indexOf("zh-sg") === 0) {
            return "zh-CN";
          }
          if (
            lower.indexOf("zh-tw") === 0 ||
            lower.indexOf("zh-hk") === 0 ||
            lower.indexOf("zh-mo") === 0 ||
            lower.indexOf("zh-hant") === 0
          ) {
            return "zh-TW";
          }
          if (lower === "pt" || lower.indexOf("pt-") === 0) {
            return "pt-BR";
          }
          var base = lower.split("-")[0];
          return copy[base] ? base : "en";
        }

        try {
          var stored = localStorage.getItem(localeKey);
          var detected =
            stored ||
            (navigator.languages && navigator.languages[0]) ||
            navigator.language ||
            "en";
          var locale = normalizeLocale(detected);
          var localized = copy[locale] || copy.en;
          document.documentElement.lang = locale;
          var description = document.querySelector('[data-i18n-meta=\"description\"]');
          if (description) description.setAttribute("content", localized.description);
          var boot = document.querySelector("[data-boot-copy]");
          if (boot) boot.textContent = localized.boot;
        } catch {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Devices that report no safe-area inset (floating status bar) still
      // need the header kept below the status bar.
      window.addEventListener("load", function () {
        try {
          var probe = document.createElement("div");
          probe.style.cssText =
            "position:fixed;top:env(safe-area-inset-top);left:0;width:1px;height:1px;";
          document.body.appendChild(probe);
          var top = Math.round(probe.getBoundingClientRect().top);
          probe.remove();
          if (top === 0 && navigator.standalone === true) {
            document.documentElement.classList.add("no-safe-area");
          }
        } catch (e) {
          /* ignore */
        }
      });
    </script>
