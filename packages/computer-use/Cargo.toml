[package]
name = "nanobot-computer-use"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]
exclude = [".cua-source"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
cua-driver-sdk = { path = ".cua-source/libs/cua-driver/rust/crates/cua-driver-sdk" }
cursor-overlay = { path = ".cua-source/libs/cua-driver/rust/crates/cursor-overlay" }
platform-macos = { path = ".cua-source/libs/cua-driver/rust/crates/platform-macos" }
screencapturekit = { version = "6", features = ["macos_15_0"] }
